<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مصروفي — تم الإيقاف</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}</style></head>
<body><div><h1>تم إيقاف مصروفي</h1><p id="s">جاري حذف البيانات من هذا الجهاز…</p></div>
<script>
(async () => {
  try { indexedDB.deleteDatabase('m9rofi'); } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { for (const r of (await navigator.serviceWorker?.getRegistrations()) || []) await r.unregister(); } catch (e) {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  document.getElementById('s').textContent = 'تم حذف كل البيانات من هذا الجهاز. احذف الأيقونة من الشاشة الرئيسية.';
})();
</script></body></html>
